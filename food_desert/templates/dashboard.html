{% extends 'base.html' %}
{% load static %}

{% block title %}BI Dashboard - DataHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 text-center mb-4">
        <h1 class="display-5 fw-bold"
            style="background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            Food Security Analytics
        </h1>
        <p class="text-muted">Business Intelligence Overview</p>
    </div>

    <div class="col-12">
        <!-- Manual Launch Button -->
        <div class="text-center mb-5">
            <a href="https://app.powerbi.com/groups/me/reports/8714ef0e-02a1-4204-90d0-3d446eae0010/ReportSection8a03be2b98143ab279ea?ctid=604f1a96-cbe8-43f8-abbf-f8eaf5d85730&experience=power-bi"
                target="_blank" class="btn btn-primary-custom btn-lg px-5 py-3 shadow-lg">
                <i class="bi bi-box-arrow-up-right me-2"></i> Launch BI Dashboard
            </a>
            <p class="text-muted small mt-2">Open the interactive report in a new secure window</p>
        </div>

        <!-- Static Preview (Placeholder) -->
        <div class="card-custom position-relative"
            style="overflow: hidden; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);">
            <div class="card-body p-0">
                <!-- Dashboard Screenshot (Clean) -->
                <img src="{% static 'img/dashboard_preview.png' %}" class="img-fluid w-100" alt="Dashboard Preview"
                    style="min-height: 500px; object-fit: cover;">
            </div>
        </div>
    </div>
</div>
{% endblock %}
