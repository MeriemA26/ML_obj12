<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Forest - Food Insecurity Prediction</title>
    <style>
        /* --- Body et fond --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
        }

        /* --- Conteneur principal --- */
        .container {
            max-width: 600px;
            margin: 50px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        /* --- Titres --- */
        h2 {
            color: #1e3a8a;
            text-align: center;
            margin-bottom: 25px;
        }

        /* --- Labels et inputs --- */
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #1e40af;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 5px rgba(37, 99, 235, 0.3);
            outline: none;
        }

        /* --- Bouton --- */
        button {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #1e40af;
        }

        /* --- Résultat de la prédiction --- */
        .prediction {
            margin-top: 25px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #1e3a8a;
        }

        /* --- Placeholder --- */
        input::placeholder {
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Random Forest - Food Insecurity Rate Prediction</h2>
        <form method="post">
            {% csrf_token %}
            {% for feature in features %}
                <label>{{ feature }}</label>
                <input type="text" name="{{ feature }}" value="0" placeholder="Enter {{ feature }}">
            {% endfor %}
            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
            <div class="prediction">Predicted Rate: {{ prediction }}</div>
        {% endif %}
    </div>
</body>
</html>
