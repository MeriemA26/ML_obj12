<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Forest - Food Insecurity</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
        }

        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            margin: 20px auto;
            padding: 30px;
            max-width: 900px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #1a237e;
        }

        .nav-links {
            margin-bottom: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            transition: all 0.3s;
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .nav-links a.active {
            background: rgba(255, 255, 255, 0.5);
            font-weight: bold;
        }

        .form-label {
            font-weight: 600;
            color: #1a237e;
        }

        .btn-predict {
            background: linear-gradient(45deg, #1e3c72, #2a5298);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            width: 100%;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            color: white;
        }

        .result-card {
            background: #e8eaf6;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            border-left: 5px solid #3f51b5;
        }

        .result-value {
            font-size: 2rem;
            font-weight: bold;
            color: #303f9f;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Navigation -->
        <div class="nav-links text-center">
            <a href="/"><i class="bi bi-house"></i> Home</a>
            <a href="/quality/"><i class="bi bi-tree"></i> Food Quality</a>
            <a href="/diabetes-risk/"><i class="bi bi-heart-pulse"></i> Diabetes Risk</a>
            <a href="/segment/"><i class="bi bi-people"></i> Segmentation</a>
            <a href="/predictor/" class="active"><i class="bi bi-cpu"></i> RF Predictor</a>
        </div>

        <div class="main-container">
            <div class="header">
                <h1><i class="bi bi-bar-chart-fill"></i> Food Insecurity Predictor</h1>
                <p class="text-muted">Random Forest Regression Model</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    {% for feature in features %}
                    <div class="col-md-6">
                        <label class="form-label text-capitalize">{{ feature }}</label>
                        <input type="number" step="any" class="form-control" name="{{ feature }}" value="0"
                            placeholder="Enter value" required>
                    </div>
                    {% endfor %}
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-predict">
                        <i class="bi bi-calculator"></i> Calculate Rate
                    </button>
                </div>
            </form>

            {% if prediction is not None %}
            <div class="result-card">
                <h4>Predicted Insecurity Rate</h4>
                <div class="result-value">{{ prediction }}%</div>
            </div>
            {% endif %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
