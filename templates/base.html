{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DataHub Premium{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>

<body>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-hexagon-fill brand-icon"></i>
            <div>
                <h4 class="mb-0" style="color: white; font-weight: 700;">DATAHUB</h4>
                <small style="color: var(--accent); letter-spacing: 1px;">ANALYTICS</small>
            </div>
        </div>

        <div class="nav flex-column">
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                <i class="bi bi-cpu"></i>
                <span>Food Desert</span>
            </a>
            <a href="/quality/" class="nav-link {% if '/quality/' in request.path %}active{% endif %}">
                <i class="bi bi-gem"></i>
                <span>Food Quality</span>
            </a>
            <a href="/diabetes-risk/" class="nav-link {% if '/diabetes-risk/' in request.path %}active{% endif %}">
                <i class="bi bi-activity"></i>
                <span>Diabetes Risk</span>
            </a>
            <a href="/obesity/" class="nav-link {% if '/obesity/' in request.path %}active{% endif %}">
                <i class="bi bi-speedometer2"></i>
                <span>Obesity Risk</span>
            </a>
            <a href="/segment/" class="nav-link {% if '/segment/' in request.path %}active{% endif %}">
                <i class="bi bi-pie-chart"></i>
                <span>Segmentation</span>
            </a>
            <a href="/access/" class="nav-link {% if '/access/' in request.path %}active{% endif %}">
                <i class="bi bi-geo-alt"></i>
                <span>Limited Access</span>
            </a>
            <a href="/predictor/" class="nav-link {% if request.path == '/predictor/' %}active{% endif %}">
                <i class="bi bi-heart-pulse"></i>
                <span>Health Score</span>
            </a>
            <a href="/predictor/store/" class="nav-link {% if '/predictor/store/' in request.path %}active{% endif %}">
                <i class="bi bi-shop"></i>
                <span>Store Impact</span>
            </a>
        </div>

        <div class="mt-auto p-4">
            <div class="card-custom p-3 border-0 bg-gradient text-center">
                <small class="text-muted d-block mb-2">System Status</small>
                <span class="badge bg-success rounded-pill px-3">ONLINE</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container-fluid">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
