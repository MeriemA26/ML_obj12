{% extends 'base.html' %}
{% load static %}

{% block title %}BI Dashboard - DataHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 text-center mb-4">
        <h1 class="display-5 fw-bold"
            style="background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            Food Security Analytics
        </h1>
        <p class="text-muted">Business Intelligence Overview</p>
    </div>

    <div class="col-12">
        <div class="card-custom" style="height: 800px; overflow: hidden;">
            <div class="card-body p-0 h-100">
                <!-- Power BI Embedded Iframe -->
                <!-- REPLACE 'src' with your actual Publish to Web URL from Power BI -->
                <iframe title="Food Security Dashboard" width="100%" height="100%"
                    src="PASTE_YOUR_FULL_POWER_BI_LINK_HERE" frameborder="0" allowFullScreen="true">
                </iframe>

                <!-- Fallback/Placeholder if no link is provided yet -->
                <div class="d-none d-flex align-items-center justify-content-center h-100 bg-dark">
                    <div class="text-center">
                        <i class="bi bi-bar-chart-fill text-muted" style="font-size: 4rem;"></i>
                        <h3 class="text-muted mt-3">Power BI Dashboard</h3>
                        <p class="text-secondary">Embed your report URL in dashboard.html</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
